name: Build Nota Mete APK v1.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick file

      - name: Validate and prepare web assets
        shell: bash
        run: |
          set -euo pipefail
          test -f www/index.html
          test -f www/nota.html
          test -f www/timbang.html
          test -f www/nota-mete.ico
          file www/nota-mete.ico

          mkdir -p assets
          convert www/nota-mete.ico -background none -resize 512x512 assets/nota-mete.png
          test -s assets/nota-mete.png

      - name: Install Capacitor
        run: |
          npm init -y
          npm install --save-exact @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
          npx cap init "Nota Mete" "com.metefarm.notamete" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configure Android 7+ and application icon
        shell: bash
        run: |
          set -euo pipefail

          # Android 7.0 is API level 24.
          sed -i -E 's/^([[:space:]]*)minSdkVersion[[:space:]]*=.*/\1minSdkVersion = 24/' android/variables.gradle
          sed -i -E 's/^([[:space:]]*)targetSdkVersion[[:space:]]*=.*/\1targetSdkVersion = 35/' android/variables.gradle
          sed -i -E 's/^([[:space:]]*)compileSdkVersion[[:space:]]*=.*/\1compileSdkVersion = 35/' android/variables.gradle

          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 13/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.3"/' android/app/build.gradle

          # Use the supplied icon for all standard launcher densities.
          for dir in android/app/src/main/res/mipmap-*; do
            [ -d "$dir" ] || continue
            convert assets/nota-mete.png -resize 192x192 "$dir/ic_launcher.png"
            convert assets/nota-mete.png -resize 192x192 "$dir/ic_launcher_round.png"
          done

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "nota mete v1.3.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nota-mete-v1.3
          path: "nota mete v1.3.apk"
          if-no-files-found: error
