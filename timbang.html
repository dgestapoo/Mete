<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Timbang</title>
    <style>
        /* 1. Pengaturan Dasar & Tema Gelap (Teks Serba Putih) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #1E1E1E;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Navigasi Kembali */
        .btn-back {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* Header Judul & Tanggal */
        .header h1 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #FFFFFF;
        }

        .header .date {
            font-size: 16px;
            color: #FFFFFF;
        }

        /* Form Input Section */
        .form-card {
            background-color: #2A2A2A;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: #FFFFFF;
            font-weight: bold;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        /* Wrapper Input & Icon Kamera */
        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-wrapper .input-field {
            padding-right: 42px;
        }

        .btn-camera {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: #AAAAAA;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s, background-color 0.2s;
        }

        .btn-camera:hover, .btn-camera:active {
            color: #00E676;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background-color: #1E1E1E;
            border: 1px solid #555555;
            border-radius: 10px;
            color: #FFFFFF;
            font-size: 16px;
            outline: none;
        }

        .input-field::placeholder {
            color: #888888;
        }

        .input-field:focus {
            border-color: #00E676;
        }

        .btn-add {
            background-color: #4A4A4A;
            color: #FFFFFF;
            border: 1px solid #666666;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-add:active {
            opacity: 0.8;
        }

        /* Tabel Grid 4 Kolom (Ekr Kg.) */
        .table-card {
            background-color: #2A2A2A;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #3A3A3A;
        }

        .grid-header {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
            font-weight: bold;
            padding-bottom: 8px;
            border-bottom: 1px solid #555555;
            color: #FFFFFF;
            font-size: 13px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background-color: #555555;
            margin-top: 8px;
            border-radius: 6px;
            overflow: hidden;
        }

        .grid-item {
            background-color: #2A2A2A;
            padding: 10px 2px;
            text-align: center;
            font-size: 13px;
            color: #FFFFFF;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
        }

        .grid-item:hover {
            background-color: #383838;
        }

        .grid-item .ekr-val {
            color: #00E676;
            font-weight: bold;
            font-size: 11px;
        }

        .grid-item .kg-val {
            color: #FFFFFF;
            font-weight: bold;
            font-size: 14px;
        }

        /* Ringkasan Kalkulasi */
        .summary-card {
            background-color: #2A2A2A;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            color: #FFFFFF;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #3A3A3A;
        }

        .summary-row:last-of-type {
            border-bottom: none;
        }

        .summary-row span {
            text-align: left;
            color: #FFFFFF;
        }

        .summary-row b {
            text-align: right;
            color: #FFFFFF;
        }

        .highlight {
            color: #55FF55 !important;
            font-weight: bold;
        }

        /* Grup Tombol Aksi */
        .btn-action-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-save {
            flex: 1;
            background-color: #00E676;
            color: #000000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear {
            flex: 1;
            background-color: transparent;
            color: #FF6B6B;
            border: 1px solid #FF6B6B;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            color: #FFFFFF;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Modal Popup Kustom */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-box {
            background-color: #2A2A2A;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            border: 1px solid #444444;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #FFFFFF;
        }

        .modal-message {
            font-size: 14px;
            color: #FFFFFF;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 6px;
        }

        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }

        .btn-modal-cancel {
            background-color: #4A4A4A;
            color: #FFFFFF;
        }

        .btn-modal-ok {
            background-color: #FF6B6B;
            color: #FFFFFF;
        }

        .btn-modal-ok.success {
            background-color: #00E676;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Navigasi Kembali -->
        <a href="index.html" class="btn-back">← Kembali ke Utama</a>

        <!-- Header -->
        <div class="header">
            <h1>Data Timbang</h1>
            <div class="date" id="displayDate"></div>
        </div>

        <!-- Form Input Timbangan -->
        <div class="form-card">
            <div class="input-group">
                <label>Input Timbangan Baru</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="number" step="0.1" id="inputKg" class="input-field" placeholder="Jumlah Kg (misal: 11.2)">
                        <!-- Tombol Icon Kamera -->
                        <button type="button" class="btn-camera" onclick="bukaKamera()" title="Scan Angka Timbangan">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </button>
                        <!-- Input Kamera Sembunyi -->
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="prosesScanKamera(event)">
                    </div>
                    <button onclick="tambahTimbangan()" class="btn-add">Tambah</button>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group" style="flex: 1;">
                    <label for="settingKeranjang">Sett. Keranjang</label>
                    <input type="number" step="0.1" id="settingKeranjang" class="input-field" value="11.0" oninput="hitungTotal()">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label for="settingEkor">Sett. Ekor</label>
                    <input type="number" id="settingEkor" class="input-field" value="25" placeholder="Ekor">
                </div>
            </div>
        </div>

        <!-- Tabel Grid Timbangan (4 Kolom) -->
        <div class="table-card">
            <div class="grid-header">
                <div>Ekr Kg.</div>
                <div>Ekr Kg.</div>
                <div>Ekr Kg.</div>
                <div>Ekr Kg.</div>
            </div>
            <div class="grid-container" id="gridTimbangan"></div>
        </div>

        <!-- Ringkasan Kalkulasi -->
        <div class="summary-card">
            <div class="summary-row">
                <span>Jml Total</span>
                <b id="lblJmlTotal">0.0 kg</b>
            </div>
            <div class="summary-row">
                <span>Berat Keranjang</span>
                <b id="lblBeratKeranjang">0.0 kg</b>
            </div>
            <div class="summary-row">
                <span>Jumlah Ekor</span>
                <b id="lblTotalEkor">0 ekor</b>
            </div>
            <div class="summary-row">
                <span>Berat Bersih</span>
                <b id="lblBeratBersih" class="highlight">0.0 kg</b>
            </div>
            <div class="summary-row">
                <span>Rata2 Bobot/Ekor</span>
                <b id="lblRataBobot">0.00 kg</b>
            </div>
            
            <div class="btn-action-group">
                <button onclick="konfirmasiSimpanData()" class="btn-save">Simpan Data</button>
                <button onclick="konfirmasiHapusSemua()" class="btn-clear">Reset Data</button>
            </div>
        </div>

        <div class="footer">by mete farm</div>
    </div>

    <!-- Modal Confirmation Popup -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Konfirmasi</div>
            <div class="modal-message" id="modalMessage">Apakah Anda yakin?</div>
            <div class="modal-buttons">
                <button id="btnModalCancel" onclick="tutupModal()" class="btn-modal btn-modal-cancel">Batal</button>
                <button id="btnModalOk" class="btn-modal btn-modal-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // 1. Tampilkan Tanggal Sistem
        function tampilkanTanggalSistem() {
            const sekarang = new Date();
            const opsi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('displayDate').innerText = sekarang.toLocaleDateString('id-ID', opsi);
        }

        // 2. Buka Kamera Native
        function bukaKamera() {
            document.getElementById('cameraInput').click();
        }

        // 3. Proses Scan Kamera Cepat dengan Cloud OCR
        async function prosesScanKamera(event) {
            const file = event.target.files[0];
            if (!file) return;

            bukaModal('Membaca Foto...', 'Sedang memproses angka timbangan...', null, false);

            try {
                // A. Kompres gambar ke ukuran kecil (max 800px) agar upload cepat
                const base64Image = await kompresGambar(file, 800);

                // B. Kirim ke API Cloud OCR Engine 2 (khusus angka & LCD)
                const formData = new FormData();
                formData.append("base64Image", base64Image);
                formData.append("language", "eng");
                formData.append("isOverlayRequired", "false");
                formData.append("OCREngine", "2"); // Engine 2 optimal untuk angka LCD timbangan

                const response = await fetch("https://api.ocr.space/parse/image", {
                    method: "POST",
                    headers: { "apikey": "helloworld" }, // Public free key
                    body: formData
                });

                const data = await response.json();
                tutupModal();

                if (data && data.ParsedResults && data.ParsedResults.length > 0) {
                    const teksHasil = data.ParsedResults[0].ParsedText;
                    const teksClean = teksHasil.replace(/,/g, '.');
                    const match = teksClean.match(/\d+(\.\d+)?/);

                    if (match) {
                        const angka = parseFloat(match[0]);
                        document.getElementById('inputKg').value = angka;
                        document.getElementById('inputKg').focus();
                    } else {
                        bukaModal('Scan Gagal', 'Angka tidak terdeteksi. Pastikan foto fokus pada angka layar timbangan.', null, false);
                    }
                } else {
                    bukaModal('Scan Gagal', 'Gagal membaca gambar dari layanan OCR.', null, false);
                }
            } catch (err) {
                tutupModal();
                bukaModal('Error', 'Gagal terhubung ke OCR: ' + err.message, null, false);
            } finally {
                event.target.value = '';
            }
        }

        // Helper: Kompres Foto di Canvas
        function kompresGambar(file, maxWidth) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // Data Timbangan Default
        let daftarTimbangan = JSON.parse(localStorage.getItem('notaMete_timbangan')) || [
            { kg: 11.2, ekor: 25 }, { kg: 10.8, ekor: 25 }, { kg: 11.5, ekor: 25 }, { kg: 11.1, ekor: 25 },
            { kg: 10.9, ekor: 25 }, { kg: 11.3, ekor: 25 }, { kg: 11.0, ekor: 25 }, { kg: 11.4, ekor: 25 },
            { kg: 11.6, ekor: 25 }, { kg: 10.7, ekor: 25 }, { kg: 11.2, ekor: 25 }, { kg: 11.0, ekor: 25 },
            { kg: 11.1, ekor: 25 }, { kg: 11.5, ekor: 25 }, { kg: 10.8, ekor: 25 }, { kg: 11.3, ekor: 25 },
            { kg: 10.6, ekor: 25 }, { kg: 11.2, ekor: 25 }, { kg: 11.1, ekor: 25 }, { kg: 11.5, ekor: 25 },
            { kg: 11.4, ekor: 25 }, { kg: 10.9, ekor: 25 }, { kg: 11.7, ekor: 25 }, { kg: 10.8, ekor: 25 },
            { kg: 11.0, ekor: 25 }, { kg: 11.1, ekor: 25 }, { kg: 11.3, ekor: 25 }, { kg: 11.6, ekor: 25 },
            { kg: 11.3, ekor: 25 }, { kg: 10.6, ekor: 25 }, { kg: 11.4, ekor: 25 }, { kg: 11.2, ekor: 25 },
            { kg: 10.7, ekor: 25 }, { kg: 11.0, ekor: 25 }, { kg: 10.9, ekor: 25 }, { kg: 11.1, ekor: 25 },
            { kg: 11.5, ekor: 25 }, { kg: 11.4, ekor: 25 }, { kg: 11.0, ekor: 25 }, { kg: 11.3, ekor: 25 }
        ];

        function tambahTimbangan() {
            const inputKg = document.getElementById('inputKg');
            const settingEkor = document.getElementById('settingEkor');

            const kgVal = parseFloat(inputKg.value);
            const ekorVal = parseInt(settingEkor.value) || 25;

            if (isNaN(kgVal) || kgVal <= 0) {
                bukaModal('Peringatan', 'Silakan masukkan jumlah kg timbangan yang valid!', null, false);
                return;
            }

            daftarTimbangan.push({ kg: kgVal, ekor: ekorVal });
            inputKg.value = '';
            inputKg.focus();

            simpanDanRender();
        }

        function hitungTotal() {
            const beratKeranjangSatuan = parseFloat(document.getElementById('settingKeranjang').value) || 0;

            let totalKg = 0;
            let totalEkor = 0;

            daftarTimbangan.forEach(item => {
                totalKg += item.kg;
                totalEkor += item.ekor;
            });

            const totalKeranjang = daftarTimbangan.length * beratKeranjangSatuan;
            const beratBersih = totalKg - totalKeranjang;
            const rataRataBobot = totalEkor > 0 ? (beratBersih / totalEkor) : 0;

            document.getElementById('lblJmlTotal').innerText = totalKg.toFixed(1) + ' kg';
            document.getElementById('lblBeratKeranjang').innerText = totalKeranjang.toFixed(1) + ' kg';
            document.getElementById('lblTotalEkor').innerText = totalEkor + ' ekor';
            document.getElementById('lblBeratBersih').innerText = beratBersih.toFixed(1) + ' kg';
            document.getElementById('lblRataBobot').innerText = rataRataBobot.toFixed(2) + ' kg';

            renderGrid();
        }

        function renderGrid() {
            const gridContainer = document.getElementById('gridTimbangan');
            gridContainer.innerHTML = '';

            daftarTimbangan.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'grid-item';
                itemDiv.innerHTML = `<span class="ekr-val">${item.ekor}</span> <span class="kg-val">${item.kg.toFixed(1)}</span>`;
                
                itemDiv.onclick = () => {
                    bukaModal(
                        'Hapus Item',
                        `Hapus data timbangan ke-${index + 1} (${item.ekor} ekr / ${item.kg} kg)?`,
                        () => {
                            daftarTimbangan.splice(index, 1);
                            simpanDanRender();
                        }
                    );
                };

                gridContainer.appendChild(itemDiv);
            });
        }

        function simpanDanRender() {
            localStorage.setItem('notaMete_timbangan', JSON.stringify(daftarTimbangan));
            hitungTotal();
        }

        function konfirmasiSimpanData() {
            bukaModal(
                'Simpan Data',
                'Apakah Anda yakin ingin menyimpan seluruh data timbangan saat ini?',
                () => {
                    localStorage.setItem('notaMete_timbangan', JSON.stringify(daftarTimbangan));
                    bukaModal('Berhasil', 'Data timbangan berhasil disimpan!', null, false, true);
                },
                true
            );
        }

        function konfirmasiHapusSemua() {
            bukaModal(
                'Reset Data',
                'Apakah Anda yakin ingin menghapus SELURUH data timbangan?',
                () => {
                    daftarTimbangan = [];
                    simpanDanRender();
                }
            );
        }

        function bukaModal(judul, pesan, aksiOk = null, tampilkanBatal = true, isSuccess = false) {
            document.getElementById('modalTitle').innerText = judul;
            document.getElementById('modalMessage').innerText = pesan;

            const modal = document.getElementById('customModal');
            const btnCancel = document.getElementById('btnModalCancel');
            const btnOk = document.getElementById('btnModalOk');

            btnCancel.style.display = tampilkanBatal ? 'block' : 'none';
            btnOk.className = isSuccess ? 'btn-modal btn-modal-ok success' : 'btn-modal btn-modal-ok';

            btnOk.onclick = () => {
                tutupModal();
                if (aksiOk) aksiOk();
            };

            modal.style.display = 'flex';
        }

        function tutupModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        // Inisialisasi awal
        tampilkanTanggalSistem();
        hitungTotal();
    </script>
</body>
</html>
