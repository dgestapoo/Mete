<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota Mete - Halaman Utama</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #1E1E1E;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 40px;
            font-weight: bold;
            margin-top: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary {
            background-color: #4A4A4A;
            color: #FFFFFF;
            border: none;
        }

        .btn-outline {
            background-color: transparent;
            color: #FFFFFF;
            border: 2px solid #FFFFFF;
        }

        .footer {
            color: #888888;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <h1 class="title">Nota Mete</h1>

        <div class="button-group">
            <!-- Navigasi menuju nota.html -->
            <a href="nota.html" class="btn btn-primary">Masuk Nota</a>
            
            <!-- Navigasi menuju timbang.html (ubah ke timbangan.html jika nama file diubah) -->
            <a href="timbang.html" class="btn btn-outline">Data Timbang</a>
        </div>

        <div class="footer">
            by mete farm
        </div>

    </div>

</body>
</html>
