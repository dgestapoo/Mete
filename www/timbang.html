<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F0F0F">
    <title>Data Timbang - Nota Mete</title>
    <link rel="icon" href="nota-mete.ico" type="image/x-icon">
    <style>
        :root {
            --bg: #0F0F0F;
            --surface: #1A1A1A;
            --surface-2: #242424;
            --border: #333333;
            --text: #FFFFFF;
            --text-muted: #A0A0A0;
            --accent: #22C55E;
            --accent-soft: rgba(34, 197, 94, 0.15);
            --danger: #EF4444;
            --radius: 14px;
            --radius-lg: 18px;
            --shadow: 0 4px 16px rgba(0,0,0,0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            min-height: 100%;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        .app {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .header .date {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .form-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper .input-field {
            padding-right: 48px;
        }

        .input-field::placeholder {
            color: #666;
            font-weight: 500;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn-camera {
            position: absolute;
            right: 8px;
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
        }

        .btn-camera:active {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .btn-add {
            background: linear-gradient(135deg, #22C55E, #16A34A);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
            min-width: 90px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-add:active {
            opacity: 0.9;
            transform: scale(0.97);
        }

        /* Grid */
        .grid-header {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--border);
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
        }

        .grid-item {
            background: var(--surface);
            padding: 12px 4px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            transition: background 0.15s;
            min-height: 52px;
        }

        .grid-item:active {
            background: var(--surface-2);
        }

        .grid-item .ekr-val {
            color: var(--accent);
            font-weight: 700;
            font-size: 11px;
        }

        .grid-item .kg-val {
            color: var(--text);
            font-weight: 800;
            font-size: 15px;
        }

        /* Summary */
        .summary-card {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }

        .summary-row:last-of-type {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .summary-row span {
            color: var(--text-muted);
            font-weight: 500;
        }

        .summary-row b {
            font-weight: 800;
            font-size: 16px;
        }

        .highlight {
            color: var(--accent) !important;
            font-size: 18px !important;
        }

        .btn-action-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-save, .btn-clear {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: transform 0.12s, opacity 0.12s;
        }

        .btn-save:active, .btn-clear:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-save {
            background: linear-gradient(135deg, #22C55E, #16A34A);
            color: #000;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-clear {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 8px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
        }

        .modal-message {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-modal {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-modal-cancel {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-modal-ok {
            background: var(--danger);
            color: #fff;
        }

        .btn-modal-ok.success {
            background: linear-gradient(135deg, #22C55E, #16A34A);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="app">
        <a href="index.html" class="btn-back">← Kembali</a>

        <div class="header">
            <h1>Data Timbang</h1>
            <div class="date" id="displayDate"></div>
        </div>

        <div class="card form-card">
            <div class="input-group">
                <label>Input Timbangan Baru</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="number" step="0.1" id="inputKg" class="input-field" placeholder="Kg (misal: 11.2)" inputmode="decimal">
                        <button type="button" class="btn-camera" onclick="bukaKamera()" title="Scan Angka">
                            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </button>
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="prosesScanKamera(event)">
                    </div>
                    <button onclick="tambahTimbangan()" class="btn-add">Tambah</button>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group" style="flex:1">
                    <label for="settingKeranjang">Sett. Keranjang</label>
                    <input type="number" step="0.1" id="settingKeranjang" class="input-field" value="11.0" oninput="hitungTotal()" inputmode="decimal">
                </div>
                <div class="input-group" style="flex:1">
                    <label for="settingEkor">Sett. Ekor</label>
                    <input type="number" id="settingEkor" class="input-field" value="25" placeholder="Ekor" inputmode="numeric">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="grid-header">
                <div>Ekr Kg.</div>
                <div>Ekr Kg.</div>
                <div>Ekr Kg.</div>
                <div>Ekr Kg.</div>
            </div>
            <div class="grid-container" id="gridTimbangan"></div>
        </div>

        <div class="card summary-card">
            <div class="summary-row">
                <span>Jml Total</span>
                <b id="lblJmlTotal">0.0 kg</b>
            </div>
            <div class="summary-row">
                <span>Berat Keranjang</span>
                <b id="lblBeratKeranjang">0.0 kg</b>
            </div>
            <div class="summary-row">
                <span>Jumlah Ekor</span>
                <b id="lblTotalEkor">0 ekor</b>
            </div>
            <div class="summary-row">
                <span>Berat Bersih</span>
                <b id="lblBeratBersih" class="highlight">0.0 kg</b>
            </div>
            <div class="summary-row">
                <span>Rata2 Bobot/Ekor</span>
                <b id="lblRataBobot">0.00 kg</b>
            </div>

            <div class="btn-action-group">
                <button onclick="konfirmasiSimpanData()" class="btn-save">Simpan Data</button>
                <button onclick="konfirmasiHapusSemua()" class="btn-clear">Reset Data</button>
            </div>
        </div>

        <div class="footer">by mete farm</div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Konfirmasi</div>
            <div class="modal-message" id="modalMessage">Apakah Anda yakin?</div>
            <div class="modal-buttons">
                <button id="btnModalCancel" onclick="tutupModal()" class="btn-modal btn-modal-cancel">Batal</button>
                <button id="btnModalOk" class="btn-modal btn-modal-ok">OK</button>
            </div>
        </div>
    </div>

    <script>
        function tampilkanTanggalSistem() {
            const sekarang = new Date();
            const opsi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('displayDate').innerText = sekarang.toLocaleDateString('id-ID', opsi);
        }

        function bukaKamera() {
            document.getElementById('cameraInput').click();
        }

        async function prosesScanKamera(event) {
            const file = event.target.files[0];
            if (!file) return;

            bukaModal('Membaca Foto...', 'Sedang memproses angka timbangan...', null, false);

            try {
                const base64Image = await kompresGambar(file, 800);
                const formData = new FormData();
                formData.append("base64Image", base64Image);
                formData.append("language", "eng");
                formData.append("isOverlayRequired", "false");
                formData.append("OCREngine", "2");

                const response = await fetch("https://api.ocr.space/parse/image", {
                    method: "POST",
                    headers: { "apikey": "helloworld" },
                    body: formData
                });

                const data = await response.json();
                tutupModal();

                if (data && data.ParsedResults && data.ParsedResults.length > 0) {
                    const teksHasil = data.ParsedResults[0].ParsedText;
                    const teksClean = teksHasil.replace(/,/g, '.');
                    const match = teksClean.match(/\d+(\.\d+)?/);

                    if (match) {
                        const angka = parseFloat(match[0]);
                        document.getElementById('inputKg').value = angka;
                        document.getElementById('inputKg').focus();
                    } else {
                        bukaModal('Scan Gagal', 'Angka tidak terdeteksi. Pastikan foto fokus pada angka layar timbangan.', null, false);
                    }
                } else {
                    bukaModal('Scan Gagal', 'Gagal membaca gambar dari layanan OCR.', null, false);
                }
            } catch (err) {
                tutupModal();
                bukaModal('Error', 'Gagal terhubung ke OCR: ' + err.message, null, false);
            } finally {
                event.target.value = '';
            }
        }

        function kompresGambar(file, maxWidth) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        let daftarTimbangan = JSON.parse(localStorage.getItem('notaMete_timbangan')) || [
            { kg: 11.2, ekor: 25 }, { kg: 10.8, ekor: 25 }, { kg: 11.5, ekor: 25 }, { kg: 11.1, ekor: 25 },
            { kg: 10.9, ekor: 25 }, { kg: 11.3, ekor: 25 }, { kg: 11.0, ekor: 25 }, { kg: 11.4, ekor: 25 },
            { kg: 11.6, ekor: 25 }, { kg: 10.7, ekor: 25 }, { kg: 11.2, ekor: 25 }, { kg: 11.0, ekor: 25 },
            { kg: 11.1, ekor: 25 }, { kg: 11.5, ekor: 25 }, { kg: 10.8, ekor: 25 }, { kg: 11.3, ekor: 25 },
            { kg: 10.6, ekor: 25 }, { kg: 11.2, ekor: 25 }, { kg: 11.1, ekor: 25 }, { kg: 11.5, ekor: 25 },
            { kg: 11.4, ekor: 25 }, { kg: 10.9, ekor: 25 }, { kg: 11.7, ekor: 25 }, { kg: 10.8, ekor: 25 },
            { kg: 11.0, ekor: 25 }, { kg: 11.1, ekor: 25 }, { kg: 11.3, ekor: 25 }, { kg: 11.6, ekor: 25 },
            { kg: 11.3, ekor: 25 }, { kg: 10.6, ekor: 25 }, { kg: 11.4, ekor: 25 }, { kg: 11.2, ekor: 25 },
            { kg: 10.7, ekor: 25 }, { kg: 11.0, ekor: 25 }, { kg: 10.9, ekor: 25 }, { kg: 11.1, ekor: 25 },
            { kg: 11.5, ekor: 25 }, { kg: 11.4, ekor: 25 }, { kg: 11.0, ekor: 25 }, { kg: 11.3, ekor: 25 }
        ];

        function tambahTimbangan() {
            const inputKg = document.getElementById('inputKg');
            const settingEkor = document.getElementById('settingEkor');
            const kgVal = parseFloat(inputKg.value);
            const ekorVal = parseInt(settingEkor.value) || 25;

            if (isNaN(kgVal) || kgVal <= 0) {
                bukaModal('Peringatan', 'Silakan masukkan jumlah kg timbangan yang valid!', null, false);
                return;
            }

            daftarTimbangan.push({ kg: kgVal, ekor: ekorVal });
            inputKg.value = '';
            inputKg.focus();
            simpanDanRender();
        }

        function hitungTotal() {
            const beratKeranjangSatuan = parseFloat(document.getElementById('settingKeranjang').value) || 0;
            let totalKg = 0;
            let totalEkor = 0;

            daftarTimbangan.forEach(item => {
                totalKg += item.kg;
                totalEkor += item.ekor;
            });

            const totalKeranjang = daftarTimbangan.length * beratKeranjangSatuan;
            const beratBersih = totalKg - totalKeranjang;
            const rataRataBobot = totalEkor > 0 ? (beratBersih / totalEkor) : 0;

            document.getElementById('lblJmlTotal').innerText = totalKg.toFixed(1) + ' kg';
            document.getElementById('lblBeratKeranjang').innerText = totalKeranjang.toFixed(1) + ' kg';
            document.getElementById('lblTotalEkor').innerText = totalEkor + ' ekor';
            document.getElementById('lblBeratBersih').innerText = beratBersih.toFixed(1) + ' kg';
            document.getElementById('lblRataBobot').innerText = rataRataBobot.toFixed(2) + ' kg';
            renderGrid();
        }

        function renderGrid() {
            const gridContainer = document.getElementById('gridTimbangan');
            gridContainer.innerHTML = '';

            daftarTimbangan.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'grid-item';
                itemDiv.innerHTML = `<span class="ekr-val">${item.ekor}</span><span class="kg-val">${item.kg.toFixed(1)}</span>`;
                itemDiv.onclick = () => {
                    bukaModal(
                        'Hapus Item',
                        `Hapus data timbangan ke-${index + 1} (${item.ekor} ekr / ${item.kg} kg)?`,
                        () => {
                            daftarTimbangan.splice(index, 1);
                            simpanDanRender();
                        }
                    );
                };
                gridContainer.appendChild(itemDiv);
            });
        }

        function simpanDanRender() {
            localStorage.setItem('notaMete_timbangan', JSON.stringify(daftarTimbangan));
            hitungTotal();
        }

        function konfirmasiSimpanData() {
            bukaModal(
                'Simpan Data',
                'Apakah Anda yakin ingin menyimpan seluruh data timbangan saat ini?',
                () => {
                    localStorage.setItem('notaMete_timbangan', JSON.stringify(daftarTimbangan));
                    bukaModal('Berhasil', 'Data timbangan berhasil disimpan!', null, false, true);
                },
                true
            );
        }

        function konfirmasiHapusSemua() {
            bukaModal(
                'Reset Data',
                'Apakah Anda yakin ingin menghapus SELURUH data timbangan?',
                () => {
                    daftarTimbangan = [];
                    simpanDanRender();
                }
            );
        }

        function bukaModal(judul, pesan, aksiOk = null, tampilkanBatal = true, isSuccess = false) {
            document.getElementById('modalTitle').innerText = judul;
            document.getElementById('modalMessage').innerText = pesan;
            const modal = document.getElementById('customModal');
            const btnCancel = document.getElementById('btnModalCancel');
            const btnOk = document.getElementById('btnModalOk');

            btnCancel.style.display = tampilkanBatal ? 'block' : 'none';
            btnOk.className = isSuccess ? 'btn-modal btn-modal-ok success' : 'btn-modal btn-modal-ok';
            btnOk.onclick = () => {
                tutupModal();
                if (aksiOk) aksiOk();
            };
            modal.style.display = 'flex';
        }

        function tutupModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        tampilkanTanggalSistem();
        hitungTotal();
    </script>
</body>
</html>
